name = "ai-search"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[dev]
port = 8787

# Workers AI
[ai]
binding = "AI"

# Vectorize Index
# Run: npx wrangler vectorize create ai-search --dimensions=768 --metric=cosine

[[vectorize]]
binding = "VECTORIZE"
index_name = "ai-search"

# D1 Database
# Run: npx wrangler d1 create ai-search
# Run: npx wrangler d1 execute ai-search --file=schema.sql

[[d1_databases]]
binding = "DB"
database_name = "ai-search"
database_id = "YOUR_D1_DATABASE_ID"
