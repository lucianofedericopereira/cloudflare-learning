name = "redirect-engine"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[dev]
port = 8787

# KV Namespace for redirects
# Run: npx wrangler kv:namespace create REDIRECTS
# Run: npx wrangler kv:namespace create REDIRECTS --preview

[[kv_namespaces]]
binding = "REDIRECTS"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID"

# API Key for admin endpoints
# Run: npx wrangler secret put API_KEY
# For local dev, you can use:
[vars]
API_KEY = "dev-api-key-change-in-production"
